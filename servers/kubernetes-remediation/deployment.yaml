apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-remediation-mcp
  labels:
    app: kubernetes-remediation-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-remediation-mcp
  template:
    metadata:
      labels:
        app: kubernetes-remediation-mcp
    spec:
      serviceAccountName: kubernetes-remediation-mcp-sa
      containers:
      - name: mcp-server
        image: me-west1-docker.pkg.dev/robusta-development/development/kubernetes-remediation:1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # Hard verb allowlist for the approval-gated run_kubectl_command fallback
        - name: KUBECTL_ALLOWED_COMMANDS
          value: "edit,patch,delete,scale,rollout,cordon,uncordon,drain,taint,label,annotate,run,exec"

        # Dangerous flags that are always blocked
        - name: KUBECTL_DANGEROUS_FLAGS
          value: "--kubeconfig,--context,--cluster,--user,--token,--as,--as-group,--as-uid"

        # Pre-approved read-only in-container binaries for
        # run_preapproved_kubectl_exec_command (auto-approved)
        - name: KUBECTL_PREAPPROVED_EXEC_BINARIES
          value: "ps,top,df,ls,netstat,ss"

        # Pre-approved troubleshooting images for run_preapproved_diagnostic_image (auto-approved)
        - name: KUBECTL_DIAGNOSTIC_IMAGES
          value: "nicolaka/netshoot:v0.13,busybox:1.37.0,curlimages/curl:8.11.1"

        # Diagnostic-pod target policy. Diagnostic images are network-probing tools
        # and the tool is auto-approved, so targets are the security boundary.
        # "false" restricts probes to in-cluster targets, so an auto-approved probe
        # cannot ship cluster data to an external collector. Cloud-metadata and
        # link-local/loopback ranges are refused either way (not configurable).
        # Pair with diagnostic-pod-networkpolicy.yaml, applied to every namespace
        # diagnostics may run in — that is the CNI-enforced backstop.
        # Master switch. "false" disables ALL target checks (including the
        # metadata ranges) and restores the pre-fix behaviour — escape hatch for
        # environments the policy misjudges. Prefer the two narrower knobs.
        - name: KUBECTL_DIAGNOSTIC_TARGET_POLICY_ENABLED
          value: "true"

        - name: KUBECTL_DIAGNOSTIC_ALLOW_EXTERNAL_TARGETS
          value: "false"

        # DNS suffixes counted as cluster-internal (set for a custom cluster domain)
        - name: KUBECTL_DIAGNOSTIC_INTERNAL_DNS_SUFFIXES
          value: ".svc,.svc.cluster.local,.cluster.local"

        # read_file_from_container path policy (allow roots minus secret/token mounts)
        - name: KUBECTL_FILE_READ_ALLOWED_PATHS
          value: "/"
        - name: KUBECTL_FILE_READ_DENIED_PATHS
          value: "/var/run/secrets/,/run/secrets/,/var/run/secrets/kubernetes.io/serviceaccount/"

        # Enable the approval-gated fallback (set to "false" for a fully locked-down mode)
        - name: KUBECTL_ALLOW_ARBITRARY_COMMANDS
          value: "true"

        # Command timeout in seconds
        - name: KUBECTL_TIMEOUT
          value: "60"

        - name: LOG_LEVEL
          value: "INFO"

        # STRONGLY RECOMMENDED: require a bearer token on every HTTP request.
        # Without it, anyone who can reach port 8000 gets the full tool surface
        # with this pod's ServiceAccount RBAC (the NetworkPolicy is the only
        # other line of defense, and it is inert on non-enforcing CNIs).
        # kubectl create secret generic kubernetes-remediation-mcp-auth \
        #   --from-literal=token="$(openssl rand -hex 32)"
        # Then send the same value from HolmesGPT via the toolset's
        # extra_headers (see README "HTTP transport authentication").
        # - name: MCP_AUTH_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: kubernetes-remediation-mcp-auth
        #       key: token

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
