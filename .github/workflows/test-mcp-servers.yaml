name: Test MCP servers

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      github: ${{ steps.filter.outputs.github }}
      sentry: ${{ steps.filter.outputs.sentry }}
      azure: ${{ steps.filter.outputs.azure }}
      prefect: ${{ steps.filter.outputs.prefect }}
      confluence: ${{ steps.filter.outputs.confluence }}
      gcp: ${{ steps.filter.outputs.gcp }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
    steps:
      - uses: actions/checkout@v4
      # Only image-changing files, not docs, build scripts or auto-build-config.yaml
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            github:
              - "servers/github/Dockerfile"
              - "servers/github-app/Dockerfile"
              - "servers/github-app/wrapper.py"
              - "servers/github-app/github_app_auth.py"
            sentry:
              - "servers/sentry/Dockerfile"
              - "mcp_base_image/Dockerfile"
              - "mcp_base_image/patch-*.sh"
            azure:
              - "servers/azure/Dockerfile"
            prefect:
              - "servers/prefect/Dockerfile"
              - "mcp_base_image/Dockerfile"
              - "mcp_base_image/patch-*.sh"
            confluence:
              - "servers/mcp-atlassian/Dockerfile"
            gcp:
              - "servers/gcp/*/Dockerfile"
              - "servers/gcp/gcloud/entrypoint.sh"
              - "mcp_base_image/Dockerfile"
              - "mcp_base_image/patch-*.sh"
            kubernetes:
              - "servers/kubernetes-mcp-server/Dockerfile"
              - "servers/kubernetes-remediation/Dockerfile"
              - "servers/kubernetes-remediation/kubernetes_remediation.py"
              - "servers/kubernetes-remediation/requirements.txt"

  # Builds the github (PAT) and github-app images and calls a read-only tool on each
  test-github-app:
    needs: changes
    if: needs.changes.outputs.github == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest PyGithub==2.9.1 responses cryptography

      - name: Unit tests
        run: pytest servers/github-app

      - name: Docker tests
        env:
          MCP_TEST_GITHUB_PAT: ${{ secrets.MCP_TEST_GITHUB_PAT }}
          MCP_TEST_GITHUB_APP_ID: ${{ secrets.MCP_TEST_GITHUB_APP_ID }}
          MCP_TEST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MCP_TEST_GITHUB_APP_PRIVATE_KEY }}
          MCP_TEST_GITHUB_APP_INSTALLATION_ID: ${{ secrets.MCP_TEST_GITHUB_APP_INSTALLATION_ID }}
        run: pytest tests -k github -v

  # TODO: run against a real Sentry test org once MCP_TEST_SENTRY_AUTH_TOKEN exists
  test-sentry:
    needs: changes
    if: needs.changes.outputs.sentry == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test-mcp-server.yaml
    with:
      server: sentry
      build-base: true

  # TODO: run against a real Reader-only service principal once MCP_TEST_AZURE_* secrets exist
  test-azure:
    needs: changes
    if: needs.changes.outputs.azure == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test-mcp-server.yaml
    with:
      server: azure

  # Runs against a real Prefect server container
  test-prefect:
    needs: changes
    if: needs.changes.outputs.prefect == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test-mcp-server.yaml
    with:
      server: prefect
      build-base: true

  # TODO: run against an Atlassian Cloud test site once MCP_TEST_CONFLUENCE_* secrets exist
  test-confluence:
    needs: changes
    if: needs.changes.outputs.confluence == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test-mcp-server.yaml
    with:
      server: mcp-atlassian

  # TODO: run against a GCP test project once a Viewer-only service account key exists
  test-gcp:
    needs: changes
    if: needs.changes.outputs.gcp == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test-mcp-server.yaml
    with:
      server: gcp
      build-base: true

  test-kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test-mcp-server.yaml
    with:
      server: kubernetes
      kind: true
