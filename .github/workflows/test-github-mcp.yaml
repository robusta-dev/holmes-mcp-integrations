name: Test GitHub MCP servers

on:
  pull_request:
    # Only image-changing files, not docs, build scripts or auto-build-config.yaml
    paths:
      - "servers/github/Dockerfile"
      - "servers/github-app/Dockerfile"
      - "servers/github-app/wrapper.py"
      - "servers/github-app/github_app_auth.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [github, github-app]
    env:
      TEST_REPO: kotlickya/argo-repo
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mcp-under-test servers/${{ matrix.server }}

      # github-app uses App auth when its secrets are set, else falls back to the PAT
      - name: Start server
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.MCP_TEST_GITHUB_PAT }}
          GITHUB_APP_ID: ${{ secrets.MCP_TEST_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MCP_TEST_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.MCP_TEST_GITHUB_APP_INSTALLATION_ID }}
        run: |
          docker run -d --name mcp -p 8000:8000 \
            -e GITHUB_PERSONAL_ACCESS_TOKEN -e GITHUB_APP_ID -e GITHUB_APP_PRIVATE_KEY -e GITHUB_APP_INSTALLATION_ID \
            mcp-under-test

      - name: Smoke test
        env:
          MCP_TOKEN: ${{ matrix.server == 'github' && secrets.MCP_TEST_GITHUB_PAT || '' }}
        run: python3 .github/scripts/smoke_github_mcp.py http://localhost:8000/ "$TEST_REPO"

      - name: Server logs
        if: failure()
        run: docker logs --tail 50 mcp
